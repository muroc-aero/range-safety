[project]
name = "hangar-range-safety"
version = "0.1.0"
description = "Plan validation and post-run assertions for MDAO workflows"
requires-python = ">=3.11"
dependencies = [
    "hangar-sdk[all]",
    "hangar-results-reader",
    "hangar-omd",
    "jsonschema>=4.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "starlette>=0.37",
    "jinja2>=3.1",
]

[project.scripts]
range-safety = "hangar.range_safety.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hangar"]
# The built SPA lives under a gitignored dir (hashed assets, produced by the
# frontend build / Docker frontend stage). Force-include it in the wheel when
# present so the image ships the React UI; absent, the htmx shell is served.
artifacts = ["src/hangar/range_safety/dashboard/static/spa/**"]

[tool.uv.sources]
hangar-sdk = { workspace = true }
hangar-results-reader = { workspace = true }
hangar-omd = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
